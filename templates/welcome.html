<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiripa Backend</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }
        p {
            color: #7f8c8d;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            text-decoration: none;
            transition: background 0.3s;
        }
        .badge:hover {
            background-color: #2980b9;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Chiripa</h1>
        <p>This is the <strong>Chiripa Backend Base URL</strong>.</p>
        <p>The API services are running and healthy.</p>
        <a href="/admin/" class="badge">Go to Administration</a>
        <div class="footer">
            &copy; 2026 Chiripa Service Marketplace
        </div>
    </div>
</body>
</html>
