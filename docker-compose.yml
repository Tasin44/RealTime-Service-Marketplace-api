services:
  web:
    build: .
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    volumes:
      - /var/www/mychiripa_media:/app/media
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  postgres_data:
