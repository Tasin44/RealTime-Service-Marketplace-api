<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .success {
            color: #28a745;
        }

        .failed {
            color: #dc3545;
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .quote-id {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        .btn {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    {% if status == "success" %}
        <div class="status-icon success">✔</div>
        <h2 class="success">Payment Successful</h2>
        <p>Your payment has been completed successfully.</p>
    {% else %}
        <div class="status-icon failed">✖</div>
        <h2 class="failed">Payment Failed</h2>
        <p>Something went wrong with your payment.</p>
    {% endif %}

    <!-- {% if quotation_id %}
        <div class="quote-id">
            Quotation ID: <strong>{{ quotation_id }}</strong>
        </div>
    {% endif %} -->

    <!-- <a href="serviceconnect://app/home" class="btn">Go to Home</a> -->
</div>

</body>
</html>
