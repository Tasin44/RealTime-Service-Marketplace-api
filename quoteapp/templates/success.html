<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stripe Connected</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, #f7f7fb 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(22, 163, 74, 0.1);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon">✓</div>
    <h1>Stripe Connected</h1>
    <p>Your Stripe account is connected successfully. You can now accept payments.</p>
    <!-- <a class="button" href="/">Go back</a> -->
  </main>
</body>
</html>
